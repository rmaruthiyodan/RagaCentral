name: Dev

# Pushes to dev are checked and go nowhere. Dev is tested in Docker on
# the machine you are sitting at; the only thing that deploys is a push
# to main, in deploy.yml.
#
# This workflow deliberately holds no Cloudflare credentials and names no
# Cloudflare resource. It cannot deploy anything even by mistake.
on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs-design-book.html'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Time-zone tests
        run: npm test

      # A dropped %s or a stray apostrophe in the Malayalam breaks a page
      # in a way TypeScript cannot see, because to it every line is a
      # string.
      - name: Malayalam glossary
        run: npm run check:i18n

      - name: Refuse destructive SQL
        run: |
          if grep -rniE '^\s*(DROP|ALTER +TABLE +[a-z_]+ +(DROP|RENAME))' \
               schema.sql indexes.sql backfill.sql; then
            echo "::error::A destructive statement is in the schema files. Apply it by hand."
            exit 1
          fi
