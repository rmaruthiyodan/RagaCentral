name: Weekly backup

# Sunday 19:30 UTC = Monday 01:00 IST — after the week's last class and
# before the new week's first one, so a restore never lands mid-lesson.
# Also runnable by hand from the Actions tab before anything risky.
on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  database:
    name: Export the database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp the run
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backup
          npx --yes wrangler@4 d1 export sruti --remote \
            --output "backup/sruti-${{ steps.stamp.outputs.date }}.sql"

      # A dump that exists but is empty is the failure that looks like
      # success. backup-report exits non-zero on an empty users table,
      # which fails the workflow and sends the notification.
      - name: Check what was captured
        run: |
          node scripts/backup-report.mjs backup/sruti-${{ steps.stamp.outputs.date }}.sql
          node scripts/backup-report.mjs backup/sruti-${{ steps.stamp.outputs.date }}.sql --json \
            > backup/report.json

      - name: Compress
        run: gzip -9 backup/*.sql

      - uses: actions/upload-artifact@v4
        with:
          name: sruti-db-${{ steps.stamp.outputs.date }}
          path: backup/
          retention-days: 90
          if-no-files-found: error

  media:
    name: Copy new media off Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only runs once the R2 and Backblaze keys are in place. Until then
    # the database job still runs every week on its own.
    if: ${{ vars.MEDIA_BACKUP == 'on' }}
    needs: database
    steps:
      - name: Install rclone
        run: sudo -v && curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure remotes
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          B2_KEY: ${{ secrets.B2_KEY_ID }}
          B2_SECRET: ${{ secrets.B2_APP_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_KEY}
          secret_access_key = ${R2_SECRET}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private

          [b2]
          type = b2
          account = ${B2_KEY}
          key = ${B2_SECRET}
          EOF

      # copy, never sync: a file deleted in R2 — by accident, or by a bug —
      # must not be deleted from the backup as well. Existing objects are
      # skipped, so a weekly run only moves what is new.
      - name: Copy media
        run: |
          rclone copy r2:sruti-media b2:${{ secrets.B2_BUCKET }}/media \
            --transfers 8 --checkers 16 --stats 30s --stats-one-line

      - name: How much is now held
        run: rclone size b2:${{ secrets.B2_BUCKET }}/media

      # A recording whose file has gone is silent data loss: nothing
      # looks wrong until a student presses play. This is the only place
      # anything checks.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sruti-db-*
          merge-multiple: true
          path: backup

      - name: Every recording still has its file
        run: |
          gunzip -f backup/*.sql.gz
          rclone lsjson r2:sruti-media --recursive > /tmp/objects.json
          node scripts/media-audit.mjs backup/*.sql /tmp/objects.json
