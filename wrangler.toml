name = "sruti"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files (CSS, client JS, the MP3 encoder) are served free and unmetered.
assets = { directory = "./public", binding = "ASSETS" }

# Song metadata, students, notes. A few megabytes at most.
[[d1_databases]]
binding = "DB"
database_name = "sruti"
database_id = "31fe8aa6-9900-4844-ad5e-4035c57a4dc7"

# Audio, video and note screenshots. 10 GB free, downloads free forever.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sruti-media"

[ai]
# Speech to text for spoken lesson notes. Free: 10,000 neurons a day, and
# Whisper costs 46.63 per audio minute — about 200 minutes daily at no charge.
#
# Note: Workers AI has no local simulator. `wrangler dev` opens a connection
# to Cloudflare for this binding, so running locally needs `wrangler login`
# or a CLOUDFLARE_API_TOKEN. The Docker entrypoint removes this block when
# neither is present, so the container still starts with no account at all.
# The comment lives under the header on purpose: it is removed with it.
binding = "AI"

[vars]
# The Google account that becomes the first teacher on its first sign-in.
# Once projects exist this is only consulted for a database with nobody in
# it at all; BOOTSTRAP_ADMIN_EMAIL below is what makes somebody an admin.
# Everyone else who signs in waits for approval.
BOOTSTRAP_TEACHER_EMAIL = "mailratish@gmail.com"
SITE_NAME = "RP Sajeev Music"

# The one account that becomes the admin — above every project, able to
# create them and switch into any of them. Left empty, nobody is admin.
BOOTSTRAP_ADMIN_EMAIL = "mailratish@gmail.com"

# Which engine turns a spoken lesson note into text.
#   workers-ai  Whisper, inside Cloudflare, free at this volume. The default.
#   sarvam      Built for Indian languages; needs SARVAM_API_KEY. ~Rs 0.50/min.
# Set DICTATE = "off" to hide the microphone entirely.
DICTATE_PROVIDER = "workers-ai"

# Secrets — set these with `npx wrangler secret put <NAME>`, never in this file:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SESSION_SECRET      (any long random string)
#   SARVAM_API_KEY      only if DICTATE_PROVIDER = "sarvam"

# ===================================================================
# dev — a second everything, so the site your teacher uses is never
# the thing you are experimenting on.
#
# A Wrangler environment does NOT inherit the bindings above: vars,
# databases and buckets have to be repeated here, which is tedious and
# is also the safety property. There is no way to accidentally point
# dev at the live database, because the live database is not named in
# this block.
#
#   npm run deploy:dev     put the current code on the dev site
#   npm run db:dev         bring the dev database up to date
#
# Create the two resources once with:
#
#   ./scripts/first-deploy.sh dev
#
# Until then this block is inert — nothing reads it unless you pass
# --env dev.
# ===================================================================
[env.dev]
name = "sruti-dev"

[env.dev.assets]
directory = "./public"
binding = "ASSETS"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "sruti-dev"
database_id = "PUT_YOUR_DEV_D1_DATABASE_ID_HERE"

[[env.dev.r2_buckets]]
binding = "MEDIA"
bucket_name = "sruti-media-dev"

[env.dev.ai]
binding = "AI"

[env.dev.vars]
BOOTSTRAP_TEACHER_EMAIL = "mailratish@gmail.com"
BOOTSTRAP_ADMIN_EMAIL = "mailratish@gmail.com"
# Says so on every page, so a screenshot from dev is never mistaken for
# the real thing.
SITE_NAME = "RP Sajeev Music (dev)"
DICTATE_PROVIDER = "workers-ai"
